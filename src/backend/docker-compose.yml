version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=dev
      - SISRUA_AUTH_TOKEN=${SISRUA_AUTH_TOKEN:-sisrua_dev_token}
    volumes:
      - .:/app
      - backend_logs:/app/logs
      - backend_data:/app/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  backend_logs:
  backend_data:
